<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: white;
            text-align: center;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        pre {
            background: #f4f4f4;
            padding: 10px;
            overflow-x: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 ATS Resume Tracker</h1>

        <div class="card">
            <h2>📤 Upload Resume</h2>
            <input type="file" id="resumeFile" accept=".pdf,.txt">
            <button onclick="uploadResume()">Upload Resume</button>
            <div id="uploadResult"></div>
        </div>

        <div class="card">
            <h2>💼 Create Job</h2>
            <input type="text" id="jobTitle" placeholder="Job Title">
            <textarea id="jobDesc" placeholder="Job Description"></textarea>
            <input type="text" id="jobCompany" placeholder="Company">
            <input type="text" id="jobLocation" placeholder="Location">
            <button onclick="createJob()">Create Job</button>
            <div id="jobResult"></div>
        </div>

        <div class="card">
            <h2>🎯 Match Resume with Job</h2>
            <input type="number" id="resumeId" placeholder="Resume ID">
            <input type="number" id="jobId" placeholder="Job ID">
            <button onclick="match()">Calculate Match</button>
            <div id="matchResult"></div>
        </div>

        <div class="card">
            <h2>📊 Resume Quality Analyzer</h2>
            <input type="number" id="analyzeResumeId" placeholder="Resume ID">
            <button onclick="analyzeResume()">Analyze Resume</button>
            <div id="analyzeResult"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://ats-resume-tracker-pty9.onrender.com';

        async function uploadResume() {
            const file = document.getElementById('resumeFile').files[0];
            if (!file) { alert('Select a file'); return; }
            const formData = new FormData();
            formData.append('file', file);
            const response = await fetch(`${API_URL}/api/resume/upload`, { method: 'POST', body: formData });
            const result = await response.json();
            document.getElementById('uploadResult').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        }

        async function createJob() {
            const job = {
                title: document.getElementById('jobTitle').value,
                description: document.getElementById('jobDesc').value,
                company: document.getElementById('jobCompany').value,
                location: document.getElementById('jobLocation').value
            };
            const response = await fetch(`${API_URL}/api/jobdescription`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(job)
            });
            const result = await response.json();
            document.getElementById('jobResult').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        }

        async function match() {
            const resumeId = document.getElementById('resumeId').value;
            const jobId = document.getElementById('jobId').value;
            const response = await fetch(`${API_URL}/api/matching/compare`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resumeId: parseInt(resumeId), jobId: parseInt(jobId) })
            });
            const result = await response.json();
            document.getElementById('matchResult').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        }

        async function analyzeResume() {
            const resumeId = document.getElementById('analyzeResumeId').value;
            const response = await fetch(`${API_URL}/api/analyzer/${resumeId}`);
            const result = await response.json();
            document.getElementById('analyzeResult').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        }

        // Load initial data
        async function loadJobs() {
            try {
                const response = await fetch(`${API_URL}/api/jobdescription`);
                const jobs = await response.json();
                document.getElementById('jobsList').innerHTML = `<pre>${JSON.stringify(jobs, null, 2)}</pre>`;
            } catch (error) {
                console.error('Error loading jobs:', error);
            }
        }

        async function loadResumes() {
            try {
                const response = await fetch(`${API_URL}/api/resume`);
                const resumes = await response.json();
                document.getElementById('resumesList').innerHTML = `<pre>${JSON.stringify(resumes, null, 2)}</pre>`;
            } catch (error) {
                console.error('Error loading resumes:', error);
            }
        }

        loadJobs();
        loadResumes();
    </script>
</body>
</html>
